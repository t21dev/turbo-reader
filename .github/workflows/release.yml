name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One draft release, created before any build starts. The build jobs used
  # to each create it if they found none, and running in parallel they all
  # found none: v0.4.0 came out as three drafts with the files split up.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          cat > body.md <<EOF
          ## What's changed
          $NOTES

          ## Downloads
          Pick the installer for your platform below.

          - Windows: \`.msi\` or \`.exe\`
          - macOS: \`.dmg\`, with separate Apple silicon and Intel builds
          - Linux: \`.AppImage\` or \`.deb\`

          ## Note on unsigned builds
          These binaries are not code-signed. Windows SmartScreen and macOS
          Gatekeeper will warn on first run. On macOS, right-click the app and
          choose Open, or run \`xattr -cr "/Applications/Turbo Reader.app"\`.
          EOF
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Turbo Reader v$VERSION" \
            -F draft=true -F prerelease=false -F body=@body.md --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # A zip that runs without installing. The `portable` file next to the
      # exe keeps all data in a `data` folder beside it.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "Turbo Reader"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/release/turbo-reader.exe" "$dir/Turbo Reader.exe"
          Set-Content "$dir/portable" "Turbo Reader keeps its data in the data folder next to it while this file is here. Delete this file to use the normal per-user data folder instead. Needs the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 already have."
          $zip = "Turbo.Reader_${version}_x64_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          # Straight to the release by id: a draft has no public tag to look up.
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$zip" `
            -H "Content-Type: application/zip" --input $zip --jq .name
