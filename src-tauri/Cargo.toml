[package]
name = "turbo-reader"
version = "0.25.0"
description = "A fast, modern RSS reader"
authors = ["t21dev"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "turbo_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Background mode, all off until switched on in Settings.
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# MCP server for AI agents: off until switched on in Settings.
rmcp = { version = "3.5", default-features = false, features = [
  "server", "macros", "transport-io", "transport-streamable-http-server",
] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3"
http = "1"
tokio-util = "0.7"
base64 = "0.22"
dirs = "6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# feed pipeline
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls", "gzip", "brotli", "deflate", "charset",
] }
feed-rs = "2"
ammonia = "4"

# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# support
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
url = "2"
quick-xml = "0.36"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
# Tauri's own inner_size() disagrees with the real client rect on an
# undecorated window and lags a launch behind, so window geometry is measured
# straight from the OS. See src/winstate.rs.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
# The webview's right-click menu is trimmed through WebView2 itself. Both are
# already built for Tauri at these versions, so they add nothing to the size.
# See src/ctxmenu.rs.
webview2-com = "0.39"
windows-core = "0.62"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
